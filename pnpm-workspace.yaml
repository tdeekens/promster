packages:
  - packages/*
  - tooling/*
# Refuse versions published less than one day ago (in minutes) to
# reduce exposure to compromised releases. Renovate waits the same
# time (see .renovaterc.json) so its lockfile updates do not fail.
minimumReleaseAge: 1440
allowBuilds:
  '@apollo/protobufjs': true
  esbuild: true
# Remove duplicate dependency versions on every install.
autoDedupe: true
# Versions shared by more than one workspace package.
catalog:
  '@prometheus-io/client': 0.16.1
  '@tsconfig/node24': 24.0.5
  '@types/node': 24.19.1
  '@types/semver': 7.8.0
  express: 5.2.1
  merge-options: 3.0.4
  parse-prometheus-text-format: 1.1.1
  tsdown: 0.23.0
  tslib: 2.8.1
  typescript: 7.0.2
  vitest: 5.0.2
# Workspace tasks run by `pnpm pipeline`. A task is only cached when it
# declares `outputs`, and a missing `dependsOn` means no dependencies.
tasks:
  build:
    dependsOn: ['^build']
    outputs: ['dist/**']
  check-types:
    dependsOn: ['^build']
    outputs: []
  check-exports:
    dependsOn: ['build']
    outputs: []
  test:
    dependsOn: ['^build']
    outputs: []
pipelines:
  build: [build]
  check-types: [check-types]
  check-exports: [check-exports]
  test: [test]
