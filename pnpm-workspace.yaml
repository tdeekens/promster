packages:
  - packages/*
  - tooling/*
# Refuse versions published less than one day ago (in minutes) to
# reduce exposure to compromised releases. Renovate waits the same
# time (see .renovaterc.json) so its lockfile updates do not fail.
minimumReleaseAge: 1440
allowBuilds:
  '@apollo/protobufjs': true
  esbuild: true
# Remove duplicate dependency versions on every install.
autoDedupe: true
