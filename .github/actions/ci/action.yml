name: CI

description: Shared action to install dependencies

inputs:
  pipeline-cache:
    description: |
      Restore and save the `pnpm pipeline` task cache across runs. Jobs that
      enable it should run `node scripts/prune-pipeline-cache.mjs` after their
      last pipeline command, as pnpm does not evict cache entries itself.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Setup pnpm with runtime
      uses: pnpm/setup@v3
      with:
        cache: true

    - name: Resolve pipeline cache directory
      if: inputs.pipeline-cache == 'true'
      id: pipeline-cache-dir
      shell: bash
      run: echo "dir=${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/pipeline" >> "$GITHUB_OUTPUT"

    # Keyed per job so pipelines do not evict each other. The sha makes every
    # run save its pruned cache; the prefix restores the latest one.
    - name: Cache pipeline task results
      if: inputs.pipeline-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pipeline-cache-dir.outputs.dir }}
        key: pnpm-pipeline-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          pnpm-pipeline-${{ runner.os }}-${{ github.job }}-
